[package]
name = "poll-progress"
authors = ["katelyn martin <git@katelyn.world>"]
version = "0.1.0"
edition = "2024"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "in_memory"
path = "src/bin/in-memory.rs"

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
http               = { version = "1.5.0"                       }
http-body-util     = { version = "0.1.5"                       }
hyper              = { version = "1.12",   features = ["full"] }
hyper-util         = { version = "0.1.21", features = ["full"] }
pin-project        = { version = "1.1.13"                      }
thiserror          = { version = "2.0.21"                      }
tokio              = { version = "1.53.3", features = ["full"] }
tower              = { version = "0.5"                         }
tracing            = { version = "0.1"                         }
tracing-subscriber = { version = "0.3",    features = ["fmt"]  }

[features]
default = []
tracing = ["hyper/tracing"]

[patch.crates-io]
hyper = { path = ".." }
